[project]
name = "claude-chat"
version = "0.1.0"
description = "A streaming Claude chat application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0",
  "flask>=3.1.0",
  "gunicorn>=23.0.0",
  "python-dotenv>=1.0.1",
  "duckdb>=1.5.5",
  "openrouter>=1.0.0",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.9",
  "google-auth>=2.35",
  "cryptography>=43",
  "requests>=2.34.2",
  "flask-limiter>=4.1.1",
  "openai>=3.31.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
