[project]
name = "claude-chat"
version = "0.1.0"
description = "A streaming Claude chat application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0",
  "flask>=3.1.0",
  "flask-cors>=5.0.0",
  "gunicorn>=23.0.0",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"